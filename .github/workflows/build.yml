name: Build Gliese

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Test GlieseCore
        run: swift test
        working-directory: GlieseCore

      - name: Build Gliese macOS
        run: xcodebuild -project Gliese.xcodeproj -scheme Gliese -configuration Debug -destination 'platform=macOS' -derivedDataPath .build/DerivedData build
